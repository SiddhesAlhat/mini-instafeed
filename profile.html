<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>
<nav class="navbar">
  <h2>CodeIn.</h2>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="create-post.html">Create</a>
    <a href="profile.html">Profile</a>
  </div>
</nav>
<div class="profile-container">
  <img src="default-avatar.png" id="profile-img" class="profile-avatar">
  <input type="file" id="img-upload" style="display:none"/>
  <button onclick="document.getElementById('img-upload').click()">Change Image</button>
  <h2>Your Name</h2>
  <p>Email Here</p>
  <textarea placeholder="Your bio..."></textarea>
  <button>Save Profile</button>
</div>
<script>
document.getElementById('img-upload')?.addEventListener('change', e => {
  const file = e.target.files;
  if (file && file[0]) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      document.getElementById('profile-img').src = ev.target.result;
    }
    reader.readAsDataURL(file);
  }
});
</script>
</body>
</html>
