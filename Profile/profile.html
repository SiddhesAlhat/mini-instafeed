<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Profile - MiniInsta</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <img src="default-avatar.png" id="profile-img" class="profile-avatar" alt="Profile Image"/>
      <input type="file" id="img-upload" accept="image/*" style="display:none"/>
      <button onclick="document.getElementById('img-upload').click()">Change Image</button>
      <h2 id="profile-username">YourUsername</h2>
      <p id="profile-email">you@email.com</p>
    </div>
    <div class="profile-details">
      <label>Bio:</label>
      <textarea id="profile-bio" rows="3" placeholder="Write about yourself..."></textarea>
      <button onclick="saveProfile()">Save</button>
    </div>
  </div>
  <script src="profile.js"></script>
</body>
</html>
