
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CodeIn</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-container">
  <h2>Welcome Back</h2>
  <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">Sign in to continue your coding journey</p>
  <form>
    <input type="text" placeholder="Username or Email" required>
    <input type="password" placeholder="Password" required>
    <div style="text-align: right; margin-bottom: 1rem;">
      <a href="#" style="font-size: 0.85rem; color: var(--text-muted);">Forgot Password?</a>
    </div>
    <button type="submit">Sign In</button>
    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
      <p>Don't have an account? <a href="register.html">Create Account</a></p>
    </div>
  </form>
</div>

<script>
  // Add form validation and animations
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    const inputs = document.querySelectorAll('input');
    
    // Add focus animations
    inputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.style.transform = 'translateY(-2px)';
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.style.transform = 'translateY(0)';
      });
    });
    
    // Form submission
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Add loading state
      const button = form.querySelector('button');
      const originalText = button.textContent;
      button.textContent = 'Signing In...';
      button.disabled = true;
      
      // Simulate login process
      setTimeout(() => {
        button.textContent = 'Success!';
        button.style.background = 'var(--success-gradient)';
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      }, 1500);
    });
  });
</script>
</body>
</html>
